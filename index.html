<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>W...</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #09090B;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}


/* Halo lumineux animé */

.background {
    position: absolute;
    width: 700px;
    height: 700px;
    background: radial-gradient(
        circle,
        rgba(217,119,6,0.25),
        transparent 65%
    );
    filter: blur(40px);
    animation: moveGlow 12s infinite alternate ease-in-out;
}


@keyframes moveGlow {
    from {
        transform: translate(-150px,-100px);
    }

    to {
        transform: translate(150px,100px);
    }
}


/* Grain */

.grain {
    position:absolute;
    inset:0;
    opacity:0.05;
    background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)'/%3E%3C/svg%3E");
}


/* Contenu */

.container {
    position:relative;
    z-index:2;
    text-align:center;
    animation:appear 1.8s ease;
}


@keyframes appear {
    from {
        opacity:0;
        transform:translateY(30px);
    }

    to {
        opacity:1;
        transform:none;
    }
}


.logo {

    font-size:90px;
    letter-spacing:25px;
    margin-bottom:40px;

    text-shadow:
    0 0 15px rgba(217,119,6,.7),
    0 0 50px rgba(217,119,6,.3);

    animation:pulse 4s infinite;
}


@keyframes pulse {

    50% {
        transform:scale(1.04);
        opacity:.9;
    }

}


/* Compteur */

.countdown {

    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;

}


.card {

    width:100px;
    padding:22px 10px;

    background:
    rgba(255,255,255,.07);

    border:
    1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(15px);

    border-radius:20px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.4);

}


.number {

    font-size:42px;
    font-weight:700;

}


.label {

    margin-top:8px;
    font-size:12px;
    color:#a1a1aa;
    text-transform:uppercase;

}


.message {

    margin-top:35px;
    color:#a1a1aa;
    font-size:18px;
    transition:.5s;

}


/* Confettis */

.confetti {

    position:fixed;
    width:8px;
    height:8px;
    pointer-events:none;
    z-index:5;

    animation:explode .9s forwards linear;

}


@keyframes explode {

    from {

        opacity:1;
        transform:
        translate(0,0)
        rotate(0deg)
        scale(1);

    }

    to {

        opacity:0;

        transform:
        translate(var(--x),var(--y))
        rotate(360deg)
        scale(0);

    }

}


@media(max-width:600px){

.logo {
    font-size:60px;
}

.card {

    width:75px;

}

.number {

    font-size:30px;

}

}


</style>

</head>


<body>


<div class="background"></div>

<div class="grain"></div>


<div class="container">


<div class="logo" id="logo">
W...
</div>



<div class="countdown">


<div class="card">
<div class="number" id="days">00</div>
<div class="label">jours</div>
</div>


<div class="card">
<div class="number" id="hours">00</div>
<div class="label">heures</div>
</div>


<div class="card">
<div class="number" id="minutes">00</div>
<div class="label">minutes</div>
</div>


<div class="card">
<div class="number" id="seconds">00</div>
<div class="label">secondes</div>
</div>


</div>



<div class="message" id="message">
Quelque chose approche.
</div>



</div>



<script>


// Date de lancement

const target =
new Date("2026-07-31T00:00:00+02:00");



function updateCountdown(){


const now = new Date();

const diff = target - now;


if(diff <= 0){

return;

}


days.textContent =
String(Math.floor(diff/86400000)).padStart(2,"0");


hours.textContent =
String(Math.floor(diff/3600000)%24).padStart(2,"0");


minutes.textContent =
String(Math.floor(diff/60000)%60).padStart(2,"0");


seconds.textContent =
String(Math.floor(diff/1000)%60).padStart(2,"0");


}



setInterval(updateCountdown,1000);

updateCountdown();




// Messages dynamiques

const messages=[

"Quelque chose approche.",

"Plus très longtemps.",

"Préparez-vous.",

"Une nouvelle expérience arrive."

];


let index=0;


setInterval(()=>{


message.style.opacity=0;


setTimeout(()=>{

index=(index+1)%messages.length;

message.textContent=messages[index];

message.style.opacity=1;


},500);


},5000);




// Animation W...

setInterval(()=>{


logo.textContent="W";


setTimeout(()=>logo.textContent="W.",300);

setTimeout(()=>logo.textContent="W..",600);

setTimeout(()=>logo.textContent="W...",900);


},6000);




// Confettis sous le doigt

const colors=[

"#D97706",

"#F59E0B",

"#FFFFFF",

"#FFD166"

];


function createConfetti(x,y){


for(let i=0;i<5;i++){


const c=document.createElement("div");


c.className="confetti";


c.style.left=x+"px";

c.style.top=y+"px";


c.style.background=
colors[Math.floor(Math.random()*colors.length)];


c.style.setProperty(
"--x",
(Math.random()-0.5)*120+"px"
);


c.style.setProperty(
"--y",
(Math.random()-0.5)*120+"px"
);


document.body.appendChild(c);



setTimeout(()=>{

c.remove();

},900);


}


}



document.addEventListener(
"pointermove",
(e)=>{

createConfetti(
e.clientX,
e.clientY
);

});


</script>


</body>
</html>
